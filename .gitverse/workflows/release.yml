# Релиз: Linux deb на GitVerse (зеркало .github/workflows/release.yml).
# Автопубликация — пушем тега v*. Ручной запуск (workflow_dispatch) с полем
# tag публикует релиз для СУЩЕСТВУЮЩЕГО тега — догоняющая публикация уже
# выпущенной версии (случай зеркала: тег появился до появления этого
# workflow); без tag — сборка в артефакты без публикации.
# Версия deb — из Cargo.toml; расхождение с тегом или debian/changelog
# останавливает публикацию с явной ошибкой. Сборка — dpkg-buildpackage
# (design D9/D10): debian/ с dh_installsystemd — именно он включает и
# запускает сервис при установке; cargo-deb этого не даёт.
# Публикация — публичным API GitVerse (api.gitverse.ru): нужен секрет
# RELEASE_TOKEN — токен с правом записи в репозиторий (префикс GITVERSE_*
# у имён секретов на GitVerse запрещён). Заметки релиза — секция версии
# из CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег v* для публикации релиза (пусто — только сборка)'
        type: string
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: deb-пакет и публикация (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # edition 2024 → нужен свежий stable: rustc из apt образа старше 1.85.
      # source ~/.cargo/env в каждом шаге — PATH между шагами не полагаемся
      # на платформенные механизмы (GITHUB_PATH и пр.).
      - name: Rust stable (rustup)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustc --version
      # Тесты — гейт перед упаковкой: пакет собирается только из зелёного кода.
      - name: cargo test
        run: |
          . "$HOME/.cargo/env"
          cargo test --locked
      # На образе нет build-essential (dpkg-checkbuilddeps требует его
      # неявно), debhelper (даёт debhelper-compat (= 13)) и jq (версии и
      # вызовы API ниже).
      - name: Зависимости сборки deb
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper jq
      - name: Сборка deb
        run: |
          . "$HOME/.cargo/env"
          dpkg-buildpackage -us -uc -b
      # dpkg-buildpackage кладёт пакет в родительский каталог.
      - name: deb в рабочую папку
        run: mv ../swapnotif_*.deb .
      - name: Версия из Cargo.toml
        run: . "$HOME/.cargo/env" && echo "CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "swapnotif-rs") | .version')" > versions.env
      # Забытый при бампе debian/changelog иначе молча соберёт deb старой версии.
      - name: Версия debian/changelog совпадает с Cargo.toml
        run: |
          . versions.env
          deb_version="$(dpkg-parsechangelog -l debian/changelog -S Version)"
          deb_version="${deb_version%%-*}"
          [ "$deb_version" = "$CARGO_VERSION" ] || { echo "::error::debian/changelog содержит $deb_version, а Cargo.toml — $CARGO_VERSION. Обновите debian/changelog."; exit 1; }
      # Пуш тега всегда публикует; dispatch — только с явным существующим
      # тегом в поле tag (сам workflow теги не создаёт). Повторный запуск по
      # тому же тегу переиспользует существующий релиз и доложит свежий deb.
      - name: Релиз GitVerse
        if: ${{ gitverse.event_name == 'push' || inputs.tag != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ gitverse.event_name == 'push' && gitverse.ref_name || inputs.tag }}
          API_BASE: https://api.gitverse.ru
          # Без этого Accept API GitVerse отвечает 415 на любой запрос.
          ACCEPT: application/vnd.gitverse.object+json;version=1
        run: |
          set -euo pipefail
          . versions.env
          tag="$TAG_NAME"
          # Тег совпадает с версией Cargo.toml.
          [ "$tag" = "v$CARGO_VERSION" ] || { echo "::error::Тег $tag ссылается не на v$CARGO_VERSION, а Cargo.toml — $CARGO_VERSION. Поднимите версию в Cargo.toml и перетегуйте."; exit 1; }
          # Тег существует; ^{} у аннотированного даёт коммит (последняя строка).
          tag_sha="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END{print $1}')"
          [ -n "$tag_sha" ] || { echo "::error::Тега $tag нет в репозитории — релиз создаётся только на существующий тег."; exit 1; }
          deb="swapnotif_${CARGO_VERSION}_amd64.deb"
          [ -f "$deb" ] || { echo "::error::Не найден собранный пакет $deb"; exit 1; }
          # Заметки релиза — секция версии из CHANGELOG.md.
          notes="$(awk -v ver="## [$CARGO_VERSION]" 'index($0, ver) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md)"
          [ -n "$notes" ] || notes="swapnotif v$CARGO_VERSION"
          # owner/repo из origin: форма gitverse.repository не документирована,
          # неверный путь даёт немые 404/400. Каждый вызов печатает код и тело
          # ответа при ошибке — причина видна в логе, а не угадывается.
          repo_slug="$(git remote get-url origin | sed -E 's#\.git/?$##; s#.*[:/]([^/]+)/([^/]+)$#\1/\2#')"
          api="$API_BASE/repos/$repo_slug"
          echo "Релизный API: $api"
          # Существующий релиз (404 = релиза на теге ещё нет — норма).
          resp="$(curl -sS -w '\n%{http_code}' -H "Accept: $ACCEPT" -H "Authorization: Bearer $RELEASE_TOKEN" "$api/releases/tags/$tag")"
          code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          release_id=""
          [ "$code" != 404 ] && { [ "$code" = 200 ] || { echo "::error::GET релиза: HTTP $code: $body"; exit 1; }; release_id="$(printf '%s' "$body" | jq -r '.id')"; }
          if [ -z "$release_id" ]; then
            payload="$(jq -n --arg tag "$tag" --arg sha "$tag_sha" --arg ver "$CARGO_VERSION" --arg notes "$notes" \
              '{tag_name: $tag, name: ("swapnotif v" + $ver), target_commitish: $sha, body: $notes, draft: false, prerelease: false, is_authorized_only: false}')"
            resp="$(curl -sS -w '\n%{http_code}' -X POST "$api/releases" \
              -H "Accept: $ACCEPT" \
              -H "Authorization: Bearer $RELEASE_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$payload")"
            code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
            # 409: релиз на теге создан параллельно — забираем его id.
            if [ "$code" = 409 ]; then
              resp="$(curl -sS -w '\n%{http_code}' -H "Accept: $ACCEPT" -H "Authorization: Bearer $RELEASE_TOKEN" "$api/releases/tags/$tag")"
              code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
              [ "$code" = 200 ] || { echo "::error::GET релиза после 409: HTTP $code: $body"; exit 1; }
              release_id="$(printf '%s' "$body" | jq -r '.id')"
            else
              [ "$code" = 201 ] || { echo "::error::Создание релиза: HTTP $code: $body"; exit 1; }
              release_id="$(printf '%s' "$body" | jq -r '.id')"
            fi
          fi
          # id обязателен числовой: конверт-обёртка ответа дала бы null и
          # невалидный путь /releases/null/assets (немой 400 gateway'а).
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "::error::Некорректный id релиза '$release_id' из ответа: $body"; exit 1; }
          echo "Релиз $tag: id=$release_id"
          # Загрузка deb. Вариант A — в точности из доков (Content-Type
          # без boundary), вариант B — автоматический multipart curl;
          # результат каждого виден в логе.
          upload() {
            curl -sS -w '\n%{http_code}' -X POST "$api/releases/$release_id/assets?name=$deb" \
              -H "Accept: $ACCEPT" \
              -H "Authorization: Bearer $RELEASE_TOKEN" \
              "$@" -F "attachment=@$deb"
          }
          resp="$(upload -H 'Content-Type: multipart/form-data')"
          code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          if [ "$code" != 201 ]; then
            echo "::warning::Загрузка, вариант A (Content-Type из доков): HTTP $code: $body"
            resp="$(upload)"
            code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          fi
          [ "$code" = 201 ] || { echo "::error::Загрузка вложения $deb: HTTP $code: $body"; exit 1; }
          echo "Релиз $tag опубликован: $api/releases/$release_id"
      # Ручная сборка без публикации — deb в артефакты запуска.
      - uses: actions/upload-artifact@v4
        if: ${{ !(gitverse.event_name == 'push' || inputs.tag != '') }}
        with:
          name: swapnotif-deb
          path: swapnotif_*.deb
          if-no-files-found: error
          retention-days: 7
