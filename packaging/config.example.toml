# Пример конфигурации swapnotif-rs (значения — встроенные дефолты).
#
# Установка: скопируйте в /etc/swapnotif/config.toml и раскомментируйте
# нужные поля. Все поля опциональны: пропущенное берётся из дефолта,
# зашитого в код. Неизвестное поле или значение вне диапазона — ошибка
# старта с сообщением в journald (fail-fast, design D8), опечатка в имени
# ключа не «выключает» настройку молча.

# Порог занятости swap, % (10–99): событие при fill >= threshold_pct.
#threshold_pct = 80

# Гистерезис возврата в состояние Normal, процентные пункты (1–20):
# событие сбрасывается при fill < threshold_pct - hysteresis_pct.
#hysteresis_pct = 5

# Интервал опроса /proc, секунды (1–3600).
#interval_secs = 5

# Окно атрибуции виновника, секунды (10–3600); должен быть не меньше
# interval_secs: за окно ищется процесс с наибольшим приростом swap.
# Фактическое окно меньше заданного: при window=60 и interval=5 это
# ≈55 с (глубина floor(60/5)=12 снапшотов = 11 интервалов);
# эффективное окно = (window/interval − 1) × interval.
#window_secs = 60

# Минимальный перерыв между отправками уведомлений, секунды (10–86400);
# гейтит отправку, но не фиксацию события.
#cooldown_secs = 300

# Минимальный вес виновника для попадания в уведомление, МБ (1–10240):
# при меньшем приросте виновника текст будет «приложение не определено».
#min_culprit_mb = 50
